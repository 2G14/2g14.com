# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: 2g14.com project mixin
# description はエージェントの CLAUDE.md の目次に載るので、状態の見分け方をここに書く
description: npm 依存は起動時に npm ci で入れている。/tmp/sbx-npm-ci.running があれば実行中なので終わるまで待ち、/tmp/sbx-npm-ci.failed があれば失敗しているので npm ci を実行すること

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # install ではなく startup に置くのは、install の時点ではまだ clone が無いため。
        # startup はエージェントと並行して走るので、実行中・失敗をフック自身が目印に残す。
        # 失敗しても終了コードを 0 にするのは、startup の失敗でサンドボックスが起動しなくなるため
        - command:
            - sh
            - -c
            - |
              export PATH="$HOME/.local/share/mise/shims:$PATH"
              state=/tmp/sbx-npm-ci
              rm -f "$state.running" "$state.failed"
              if ! cd "$WORKSPACE_DIR"; then
                echo "cd failed: $WORKSPACE_DIR" >&2
                touch "$state.failed"
                exit 0
              fi
              [ -f node_modules/.sbx-npm-ci-done ] && exit 0
              touch "$state.running"
              if npm ci --no-audit --no-fund; then
                touch node_modules/.sbx-npm-ci-done
              else
                echo "npm ci failed" >&2
                touch "$state.failed"
              fi
              rm -f "$state.running"
          user: agent
          env: [WORKSPACE_DIR]
          description: Install npm dependencies once the clone exists

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./project-context.md
