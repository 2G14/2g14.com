schemaVersion: '2'
kind: sandbox
# 数字で始まる名前は「built-in agents only」という無関係なエラーで拒否される
name: claude-2g14
displayName: Claude Code (no YOLO, mise toolchain)
description: >-
  mise 経由で node/gh を導入した template 上で Claude Code を
  --dangerously-skip-permissions なしで起動する。
extends: claude

sandbox:
  image: docker.io/library/2g14-sandbox:latest
  entrypoint: [claude]
  command:
    # 空配列は未指定として親の --dangerously-skip-permissions を継承するため、
    # 非空の引数で上書きする
    default: ['--permission-mode', 'default']
    interactive: ['--permission-mode', 'default']
