name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.jscpd.json'
      - 'knip.ts'
      - '.oxlintrc.jsonc'
      - '.oxfmtrc.json'
      - 'mise.toml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.jscpd.json'
      - 'knip.ts'
      - '.oxlintrc.jsonc'
      - '.oxfmtrc.json'
      - 'mise.toml'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: npm
      - run: npm i -g npm@12.2.0
      - run: npm ci
      - parallel:
          - run: npm run typecheck
          - run: npm run jscpd
          - run: npm run knip
          - run: npm run lint
          - run: npm run format:check
          - run: npx vitest run
          - run: npm run build
