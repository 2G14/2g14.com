name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.jscpd.json'
      - 'knip.ts'
      - '.oxlintrc.jsonc'
      - '.oxfmtrc.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
    paths:
      - 'app/**'
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.jscpd.json'
      - 'knip.ts'
      - '.oxlintrc.jsonc'
      - '.oxfmtrc.json'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - parallel:
          - run: npm run typecheck
          - run: npm run jscpd
          - run: npm run knip
          - run: npm run lint
          - run: npm run format:check
          - run: npx vitest run
          - run: npm run build
      # 並列グループの build 成果物を wrangler dev で配信してブラウザから検証する
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
